name: MLOps Docker Hub to EC2 Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: techwithsak/mlops-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-output.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

      - name: Set Output Tag
        id: set-output
        run: echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_IMAGE,IMAGE_TAG
          script: |
            # Fallback agar IMAGE_TAG blank ho
            IMAGE_TAG=${IMAGE_TAG:-latest}
            
            echo "Deploying Image: $DOCKER_IMAGE:$IMAGE_TAG"

            # 1. Pull Image
            docker pull $DOCKER_IMAGE:$IMAGE_TAG

            # 2. Stop & Remove existing container
            docker stop mlops-container || true
            docker rm mlops-container || true

            # 3. Run new container
            docker run -d -p 80:8000 --name mlops-container $DOCKER_IMAGE:$IMAGE_TAG

            # 4. Cleanup old unused images
            docker image prune -f
